<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <radialGradient id="glowA" cx="18%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="88%" cy="95%" r="55%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <clipPath id="round"><rect width="1200" height="320" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="#0a0d14"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glowA)"/>
    <rect width="1200" height="320" fill="url(#glowB)"/>

    <!-- terminal path -->
    <text x="72" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#64748b">~/peyoon<tspan fill="#22d3ee"> $</tspan> whoami</text>

    <!-- name -->
    <text x="68" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-2" fill="#f8fafc">Eunpyeong Yoon</text>

    <!-- accent line -->
    <rect x="72" y="198" width="56" height="4" rx="2" fill="url(#line)"/>

    <!-- role -->
    <text x="72" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#94a3b8">Software Engineer <tspan fill="#475569">·</tspan> Real-time HMI <tspan fill="#475569">·</tspan> Embedded <tspan fill="#475569">·</tspan> Networking</text>

    <!-- right side: signal motif -->
    <g transform="translate(910 168)" fill="none" stroke-linecap="round">
      <circle r="110" stroke="#ffffff" stroke-opacity="0.06"/>
      <circle r="76" stroke="#ffffff" stroke-opacity="0.08"/>
      <circle r="42" stroke="#ffffff" stroke-opacity="0.10"/>
      <path d="M-150 0 H-96 L-80 -34 L-60 40 L-40 -58 L-20 26 L0 0 H150" stroke="url(#line)" stroke-width="3"/>
      <circle cx="0" cy="0" r="5" fill="#22d3ee" stroke="none"/>
    </g>

    <!-- status chip -->
    <g transform="translate(986 64)">
      <rect width="150" height="32" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08"/>
      <circle cx="20" cy="16" r="4" fill="#22c55e"/>
      <text x="34" y="21" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#cbd5e1">C# · C++ · WPF</text>
    </g>
  </g>
</svg>
